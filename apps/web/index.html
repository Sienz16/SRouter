<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SRouter Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("srouter-theme");
                    var theme =
                        stored === "light" || stored === "dark"
                            ? stored
                            : window.matchMedia("(prefers-color-scheme: light)").matches
                              ? "light"
                              : "dark";
                    var root = document.documentElement;
                    root.classList.toggle("dark", theme === "dark");
                    root.style.colorScheme = theme;
                } catch (e) {}
            })();
        </script>
    </head>
    <body>


        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
